<!doctype html>
<!--
  Page shell for the generated artifact. render.py fills the $$placeholders using
  string.Template from the standard library, so every literal dollar sign in the
  CSS or JavaScript below must be written $$.

  This file stays a real .html file rather than a triple-quoted string in
  render.py so that the markup, the styles and the script are editable and
  diffable as what they are.

  Placeholders:
    $$title      page title
    $$data       the model, serialised to JSON, embedded in a script tag
    $$toy        the toy model's constants, likewise
    $$body       the server-free rendered content
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>$title</title>
    <style>
      /* Inlined stylesheet. No external references, no web fonts. */
      :root {
        --ink:    #0f172a;
        --head:   #334155;
        --body:   #475569;
        --mute:   #64748b;
        --faint:  #94a3b8;
        --rule:   #e2e8f0;
        --panel:  #f8fafc;
        --code:   #f1f5f9;
        --link:   #2563eb;
        --neg:    #dc2626;
        --pos:    #059669;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0; background: #fff; color: var(--body);
        font: 0.95rem/1.55 Inter, -apple-system, "Helvetica Neue", Helvetica, Arial, sans-serif;
        font-variant-numeric: tabular-nums;
      }
      .wrap { max-width: 1060px; margin: 2.2rem auto; padding: 0 1.1rem 4rem; }
      h1 { font-size: 1.45rem; color: var(--ink); margin: 0 0 .35rem;
           letter-spacing: -0.01em; font-weight: 700; }
      .lede { font-size: .95rem; color: var(--mute); margin: 0 0 1.4rem; max-width: 68ch; }
      h2 { font-size: 1.02rem; color: var(--head); font-weight: 600;
           margin: 2.2rem 0 .4rem; }
      .callout { background: var(--panel); border-left: 3px solid var(--ink);
                 border-radius: 0 8px 8px 0; padding: .85rem 1.1rem; margin: 0 0 1.4rem;
                 color: var(--ink); font-size: 1.0rem; max-width: 74ch; }
      .callout b { font-weight: 700; }
      .counts { display: flex; gap: 2rem; flex-wrap: wrap; padding: .9rem 0 0;
                border-top: 1px solid var(--rule); margin-bottom: .5rem; }
      .count b { display: block; font-size: 1.5rem; color: var(--ink); font-weight: 700;
                 line-height: 1.15; }
      .count span { font-size: .68rem; color: var(--faint); text-transform: uppercase;
                    letter-spacing: .16em; }
      .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(244px, 1fr));
              gap: .75rem; }
      .partner { background: #fff; border: 1px solid var(--rule); border-radius: 8px;
                 padding: .9rem .9rem .8rem; }
      .partner h3 { margin: 0; font-size: 1rem; color: var(--ink); font-weight: 600; }
      .partner .role { color: var(--faint); font-size: .72rem; margin: .1rem 0 .7rem;
                       text-transform: uppercase; letter-spacing: .06em; }
      .surface { margin-top: .65rem; }
      .surface > span { font-size: .66rem; text-transform: uppercase;
                        letter-spacing: .18em; color: var(--faint); }
      .chip { display: block; width: 100%; text-align: left; cursor: pointer;
              font: inherit; font-size: .82rem; margin-top: .3rem; padding: .3rem .5rem;
              background: var(--panel); color: var(--ink); border-radius: 4px;
              border: 1px solid var(--rule); border-left-width: 3px; }
      .chip.matched { border-left-color: var(--pos); }
      .chip.orphan  { border-left-color: var(--neg); background: #fff; }
      .chip:hover { border-color: var(--link); border-left-color: var(--link); }
      .chip[aria-pressed="true"] { background: var(--ink); color: #fff;
                                   border-color: var(--ink); border-left-color: var(--link); }
      .chip em { font-style: normal; color: var(--faint); font-size: .7rem;
                 display: block; margin-top: .05rem; }
      .chip[aria-pressed="true"] em { color: var(--faint); }
      .empty { color: var(--neg); font-size: .8rem; margin-top: .3rem; }
      .legend { font-size: .8rem; color: var(--mute); margin: .7rem 0 0; max-width: 78ch; }
      .legend b { color: var(--ink); font-weight: 600; }
      .controls { display: flex; gap: .4rem; flex-wrap: wrap; margin: .5rem 0 .7rem; }
      .controls button { font: inherit; font-size: .78rem; padding: .2rem .7rem;
                         border: 1px solid var(--rule); background: #fff;
                         border-radius: 4px; cursor: pointer; color: var(--mute); }
      .controls button[aria-pressed="true"] { background: var(--ink); color: #fff;
                                              border-color: var(--ink); }
      table { border-collapse: collapse; width: 100%; font-size: .82rem; }
      .scroller { overflow-x: auto; border: 1px solid var(--rule); border-radius: 8px; }
      th { text-align: left; font-size: .68rem; text-transform: uppercase;
           letter-spacing: .16em; color: var(--head); font-weight: 600;
           background: var(--panel); padding: .5rem .7rem;
           border-bottom: 1px solid var(--rule); position: sticky; top: 0; }
      td { padding: .45rem .7rem; border-bottom: 1px solid var(--rule);
           vertical-align: top; color: var(--body); }
      tbody tr:hover td { background: var(--panel); }
      tbody tr:last-child td { border-bottom: 0; }
      td.rule { white-space: nowrap; font-size: .7rem; letter-spacing: .04em;
                font-weight: 600; }
      tr.blocking td.rule { color: var(--neg); }
      tr.reported td.rule { color: var(--mute); }
      tr.advisory td.rule { color: var(--faint); }
      td.subject { white-space: nowrap; color: var(--mute); font-size: .78rem; }
      code { background: var(--code); border-radius: 3px; padding: .05rem .3rem;
             font-size: .9em; }
      .bars { display: grid; grid-template-columns: repeat(6, 1fr); gap: .3rem;
              margin: .9rem 0 .3rem; }
      .bar { grid-row: auto; background: var(--panel); border: 1px solid var(--rule);
             border-radius: 6px; padding: .35rem .6rem; }
      .bar.crit { border-color: var(--link); background: #eff6ff; }
      .bar b { display: block; font-size: .76rem; color: var(--ink); font-weight: 600; }
      .bar span { font-size: .68rem; color: var(--mute); }
      .cal { display: grid; grid-template-columns: repeat(6, 1fr); gap: .45rem;
             margin-top: .45rem; }
      .week { border: 1px solid var(--rule); border-radius: 8px; padding: .5rem .55rem;
              display: flex; flex-direction: column; gap: .35rem; }
      .week h4 { margin: 0; font-size: .66rem; text-transform: uppercase;
                 letter-spacing: .18em; color: var(--faint); font-weight: 600; }
      .mile { border-left: 3px solid var(--rule); padding-left: .45rem; }
      .mile.skeleton { border-left-color: var(--pos); }
      .mile.buffer   { border-left-color: #f59e0b; }
      .mile.demo     { border-left-color: var(--ink); }
      .mile.gate     { border-left-color: var(--link); }
      .mile b { display: block; font-size: .78rem; color: var(--ink); font-weight: 600; }
      .mile span, .sess span { display: block; font-size: .67rem; color: var(--mute);
                               line-height: 1.4; }
      .sess { background: var(--panel); border-radius: 5px; padding: .35rem .45rem;
              border-left: 3px solid transparent; }
      .sess.auth { border-left-color: var(--link); }
      .sess b { font-size: .74rem; color: var(--ink); font-weight: 600; }
      .who { float: right; letter-spacing: .04em; }
      .dot { font-style: normal; display: inline-block; width: 1.05em; height: 1.05em;
             line-height: 1.05em; text-align: center; border-radius: 50%;
             font-size: .58rem; font-weight: 700; margin-left: .1em; }
      .dot.on  { background: var(--ink); color: #fff; }
      .dot.rules { background: var(--link); color: #fff;
                   box-shadow: 0 0 0 1.5px var(--link); }
      .dot.off { background: transparent; color: var(--rule);
                 box-shadow: inset 0 0 0 1px var(--rule); }
      .gate { margin-top: auto; padding-top: .35rem; border-top: 1px dashed var(--rule);
              font-size: .65rem; color: var(--head); }
      @media (max-width: 900px) {
        .cal, .bars { grid-template-columns: repeat(2, 1fr); }
        .bar { grid-column: auto !important; }
      }
      .fig { margin: .8rem 0 0; padding: 0; }
      .fig img { width: 100%; max-width: 62rem; height: auto; display: block;
                 border: 1px solid var(--rule); border-radius: 8px; }
      .fig figcaption { font-size: .72rem; color: var(--faint); margin-top: .4rem;
                        max-width: 62rem; }
      .detail { border: 1px solid var(--rule); border-radius: 8px;
                padding: .8rem .9rem; margin-top: .5rem; }
      .detail h4 { margin: 0 0 .55rem; font-size: .95rem; color: var(--ink);
                   font-weight: 600; }
      .detail h4 b { color: var(--link); }
      .detail .from { float: right; font-size: .72rem; color: var(--faint);
                      font-weight: 400; }
      .empty-detail { font-size: .82rem; color: var(--faint); margin: .6rem 0 0; }
      table.clauses { font-size: .8rem; }
      table.clauses td.cn { font-weight: 600; color: var(--ink); white-space: nowrap; }
      table.clauses td.cf { color: var(--faint); white-space: nowrap; font-size: .74rem; }
      table.clauses td.cs { white-space: nowrap; font-size: .72rem;
                            text-transform: uppercase; letter-spacing: .09em; }
      tr.p-stated   td.cs { color: var(--pos); font-weight: 600; }
      tr.p-inferred td.cs { color: #b45309; font-weight: 600; }
      tr.p-absent   td.cs { color: var(--neg); font-weight: 600; }
      tr.p-absent   td em { color: var(--neg); font-style: normal; }
      .src { display: block; font-size: .72rem; color: var(--mute);
             margin-top: .18rem; border-left: 2px solid var(--rule);
             padding-left: .5rem; }
      /* --- The coupled toy model. Placed first on the page, because the
             page should perform the analysis and not only render it. ------- */
      .toy { border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule);
             padding: 1.25rem 0 1.5rem; margin: 1.1rem 0 1.6rem; }
      .toy-h { font-size: 1.2rem; color: var(--ink); font-weight: 700;
               margin: 0 0 .4rem; letter-spacing: -0.01em; }
      .toy-sub { font-size: .9rem; color: var(--head); font-weight: 600;
                 margin: 1.7rem 0 .45rem; }
      .tag { font-size: .58rem; text-transform: uppercase; letter-spacing: .13em;
             font-weight: 700; border-radius: 3px; padding: .04rem .3rem;
             border: 1px solid currentColor; white-space: nowrap; }
      .tag.stated  { color: var(--pos); }
      .tag.assumed { color: #b45309; }
      .dials { display: grid;
               grid-template-columns: repeat(auto-fit, minmax(212px, 1fr));
               gap: .9rem 1.5rem; margin: 1rem 0 1.15rem; }
      .dial label { display: block; font-size: .68rem; color: var(--head);
                    font-weight: 600; text-transform: uppercase;
                    letter-spacing: .1em; }
      .dial label b { float: right; color: var(--ink); font-size: .95rem;
                      font-weight: 700; letter-spacing: 0; text-transform: none; }
      .dial input[type="range"] { width: 100%; margin: .4rem 0 .15rem;
                                  accent-color: var(--ink); }
      .dial .cap { display: block; font-size: .67rem; color: var(--mute);
                   line-height: 1.5; }
      .dial .controls { margin: .4rem 0 .2rem; }
      .duo { display: grid; grid-template-columns: 1fr 1fr; gap: .9rem; }
      .col { border: 1px solid var(--rule); border-radius: 8px;
             padding: .85rem .9rem .75rem; }
      .col h3 { margin: 0; font-size: .95rem; color: var(--ink); font-weight: 600; }
      .col .sub { font-size: .7rem; color: var(--mute); line-height: 1.45;
                  margin: .25rem 0 .7rem; min-height: 4.4em; }
      .caps { display: flex; gap: 1.3rem; flex-wrap: wrap;
              border-top: 1px solid var(--rule); padding-top: .55rem; }
      .caps span { display: block; font-size: .58rem; text-transform: uppercase;
                   letter-spacing: .13em; color: var(--faint); }
      .caps b { font-size: 1rem; color: var(--ink); font-weight: 600; }
      .big { margin: .75rem 0 .35rem; display: flex; align-items: baseline;
             gap: .55rem; }
      .big b { font-size: 2.7rem; line-height: 1; font-weight: 700;
               color: var(--ink); letter-spacing: -0.03em; }
      .big.fail b { color: var(--neg); }
      .big.ok b { color: var(--pos); }
      .big span { font-size: .7rem; color: var(--mute); line-height: 1.4; }
      .big i { font-style: normal; color: var(--faint); }
      .spark svg { width: 100%; height: auto; display: block; }
      .col .note { font-size: .66rem; color: var(--faint); margin: .25rem 0 0;
                   min-height: 2.6em; line-height: 1.45; }
      .sparkkey { font-size: .68rem; color: var(--mute); margin: .6rem 0 0; }
      .sw { display: inline-block; width: .85rem; height: .26rem; border-radius: 2px;
            vertical-align: .12rem; margin: 0 .12rem 0 .55rem; }
      .sw.dem  { background: var(--ink); }
      .sw.gen  { background: var(--pos); }
      .sw.sto  { background: var(--rule); box-shadow: inset 0 0 0 1px var(--faint); }
      .sw.fail { background: var(--neg); width: .2rem; height: .72rem;
                 vertical-align: -.08rem; }
      .verdict { margin: 1.15rem 0 0; padding: .9rem 1.1rem; background: var(--panel);
                 border-left: 3px solid var(--ink); border-radius: 0 8px 8px 0;
                 color: var(--ink); font-size: .92rem; max-width: 80ch; }
      .verdict b { font-weight: 700; }
      .ceiling { margin: .7rem 0 0; padding: .75rem 1rem; border: 1px solid var(--neg);
                 border-radius: 8px; font-size: .82rem; color: var(--ink);
                 max-width: 80ch; line-height: 1.5; }
      .ceiling b { color: var(--neg); text-transform: uppercase; font-size: .62rem;
                   letter-spacing: .16em; display: block; margin-bottom: .25rem; }
      table.consts { font-size: .78rem; }
      table.consts td.cn { color: var(--ink); font-weight: 600; }
      table.consts td.cv { white-space: nowrap; color: var(--ink); }
      table.consts td.cv em { display: block; font-style: normal; color: var(--faint);
                              font-size: .68rem; }
      table.consts td.cs { white-space: nowrap; }
      table.consts td.csrc { color: var(--mute); font-size: .74rem; }
      table.consts tr.grp td { background: var(--panel); font-size: .62rem;
                               text-transform: uppercase; letter-spacing: .16em;
                               color: var(--head); font-weight: 600; }
      ul.limits { font-size: .8rem; color: var(--mute); max-width: 80ch;
                  margin: .45rem 0 0; padding-left: 1.1rem; }
      ul.limits li { margin-bottom: .32rem; }
      @media (max-width: 720px) { .duo { grid-template-columns: 1fr; } }
      footer { margin-top: 2.6rem; padding-top: .8rem; border-top: 1px solid var(--rule);
               font-size: .78rem; color: var(--faint); max-width: 76ch; }
    </style>
  </head>
  <body>
    $body
    <script type="application/json" id="model">$data</script>
    <script>
      // Inlined script. No external references, no network calls.
      (function () {
        var model = JSON.parse(document.getElementById("model").textContent);
        var rows = Array.prototype.slice.call(
          document.querySelectorAll("#findings tbody tr"));
        var chips = Array.prototype.slice.call(document.querySelectorAll(".chip"));
        var buttons = Array.prototype.slice.call(
          document.querySelectorAll(".controls button"));
        var item = null, severity = "all";

        function apply() {
          var shown = 0;
          rows.forEach(function (tr) {
            var okSev = severity === "all" || tr.className === severity;
            var okItem = !item || (tr.dataset.items || "").split("|").indexOf(item) > -1;
            var on = okSev && okItem;
            tr.hidden = !on;
            if (on) { shown += 1; }
          });
          var c = document.getElementById("shown");
          if (c) { c.textContent = shown; }
        }

        var details = Array.prototype.slice.call(
          document.querySelectorAll(".detail"));
        var nodetail = document.getElementById("nodetail");

        function showDetail() {
          var any = false;
          details.forEach(function (d) {
            var on = item !== null && d.id === "d-" + item;
            d.hidden = !on;
            if (on) { any = true; }
          });
          if (nodetail) { nodetail.hidden = any; }
        }

        chips.forEach(function (chip) {
          chip.addEventListener("click", function () {
            var key = chip.dataset.key;
            item = (item === key) ? null : key;
            chips.forEach(function (c) {
              c.setAttribute("aria-pressed", String(c.dataset.key === item));
            });
            showDetail();
            apply();
          });
        });

        showDetail();

        buttons.forEach(function (b) {
          b.addEventListener("click", function () {
            severity = b.dataset.severity;
            buttons.forEach(function (o) {
              o.setAttribute("aria-pressed", String(o === b));
            });
            apply();
          });
        });

        apply();
      })();
    </script>
  </body>
</html>
